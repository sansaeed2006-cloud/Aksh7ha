<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اكشحها Lite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #0f0f1a);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            color: #a0a0b0;
        }

        .container {
            background: #27273a;
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #e0e0e0;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #3f3f5a;
            border-radius: 8px;
            background: #1e1e2f;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: #ffd700;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #ffd700;
            color: #1e1e2f;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        .btn:hover {
            background: #e6c200;
        }

        .btn:active {
            transform: scale(0.98);
        }

        footer {
            margin-top: auto;
            padding: 20px;
            color: #6c6c8a;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>اكشحها Lite 🤫</h1>
        <p>أرسل واستقبل الرسائل السرية بكل سهولة وبدون تعقيد</p>
    </div>

    <div class="container">
        <form id="secretForm">
            <div class="form-group">
                <label for="recipient">اسم الشخص أو المستلم:</label>
                <input type="text" id="recipient" placeholder="اكتب الاسم هنا..." required>
            </div>

            <div class="form-group">
                <label for="message">الرسالة السرية:</label>
                <textarea id="message" rows="5" placeholder="اكتب رسالتك السرية هنا..." required></textarea>
            </div>

            <button type="submit" class="btn" id="submitBtn">إرسال الرسالة السرية</button>
        </form>
    </div>

    <footer>
        تطبيق اكشحها Lite &copy; 2026
    </footer>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmWjyPgmSaMcPooKcOeBW0y94ZNp4DFa0",
            authDomain: "aksh7ha.firebaseapp.com",
            projectId: "aksh7ha",
            storageBucket: "aksh7ha.firebasestorage.app",
            messagingSenderId: "1031685608222",
            appId: "1:1031685608222:web:e3d21bccce9cc395c0ef0f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('secretForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const recipient = document.getElementById('recipient').value.trim();
            const message = document.getElementById('message').value.trim();

            submitBtn.disabled = true;
            submitBtn.innerText = "جاري الإرسال...";

            try {
                await addDoc(collection(db, "messages"), {
                    to: recipient,
                    text: message,
                    time: Date.now()
                });

                alert('تم إرسال الرسالة السرية بنجاح! 🚀');
                this.reset();
            } catch (error) {
                alert('حدث خطأ أثناء الإرسال، حاول مرة أخرى!');
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "إرسال الرسالة السرية";
            }
        });
    </script>
</body>
</html>
